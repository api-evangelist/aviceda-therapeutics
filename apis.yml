aid: aviceda-therapeutics
name: Aviceda Therapeutics
description: 'Aviceda Therapeutics is a private, late-stage clinical biotechnology company
  based in Cambridge, Massachusetts that describes itself as the world leader in glyco-immune
  checkpoint therapeutics. It develops immune-mediated therapies built on a glyco-mimetic
  nanoparticle platform that targets the interaction between sialic acids on cell surfaces
  and Siglec immune receptors in order to modulate aberrant inflammation. Its lead asset,
  AVD-104, is an intravitreally administered sialic-acid-coated nanoparticle being evaluated
  in the Phase 2/3 SIGLEC trial for geographic atrophy secondary to age-related macular
  degeneration. Aviceda is a therapeutics developer, not a software vendor: it publishes
  no developer program, no public API, and no machine-readable API artifacts.'
